<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
        margin: 0;
        padding: 0;
        }
        html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        }
        canvas {
        display: block;
        }
    </style>
</head>
<body>
    <canvas></canvas>
    <script>
        const canvas = document.querySelector('canvas');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');

        const socket = new WebSocket(`ws://${window.location.host}/screen`);

        let alpha = 0;
        let beta = 0;
        let gamma = 0;

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            alpha = data.alpha;
            beta = data.beta;
            gamma = data.gamma;
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            
            const cspeed = 15;

            const moveY = -gamma * cspeed;
            const moveX = beta * cspeed;
            
            ctx.translate(canvas.width / 2 + moveX, canvas.height / 2 + moveY);
            
            ctx.rotate(gamma * Math.PI / 180);
            
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(-50, -50, 100, 100);
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('top', 0, -30);
            
            ctx.restore();
            
            ctx.fillStyle = '#333';
            ctx.font = '14px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`Alpha: ${alpha.toFixed(1)}°`, 10, 10);
            ctx.fillText(`Beta:  ${beta.toFixed(1)}°`, 10, 28);
            ctx.fillText(`Gamma: ${gamma.toFixed(1)}°`, 10, 46);
            ctx.fillText(`X: ${moveX.toFixed(0)}  Y: ${moveY.toFixed(0)}`, 10, 64);

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
